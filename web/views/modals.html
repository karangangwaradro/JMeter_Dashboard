<!-- Recompile Report Modal -->
    <div id="recompile-modal" class="modal-overlay hidden" onclick="if(event.target === this) closeRecompileModal()">
        <div class="modal-card" onclick="event.stopPropagation()">
            <div class="modal-header">
                <div style="display: flex; align-items: center; gap: 0.6rem;">
                    <span style="font-size: 1.3rem;">⚡</span>
                    <div>
                        <h3 style="margin: 0; font-size: 1.1rem;">Recompile HTML Report</h3>
                        <p id="recompile-modal-target"
                            style="margin: 0.15rem 0 0 0; font-size: 0.8rem; color: var(--text-muted);">Target: Latest
                            Execution</p>
                    </div>
                </div>
                <button type="button" class="icon-action-btn" onclick="closeRecompileModal()"
                    style="font-size: 1.1rem; line-height: 1;">✕</button>
            </div>

            <div class="modal-body" style="padding: 1.25rem 1.5rem; display: flex; flex-direction: column; gap: 1rem;">
                <p style="font-size: 0.85rem; color: var(--text-secondary); margin: 0; line-height: 1.5;">
                    Rebuilding the report will re-parse execution metrics, re-calculate SLA compliance, correlate
                    telemetry, and regenerate the interactive HTML report.
                </p>

                <!-- AI Insights Toggle Card -->
                <div class="recompile-ai-option-card">
                    <label class="recompile-checkbox-label">
                        <input type="checkbox" id="recompile-ai-checkbox" checked
                            onchange="toggleRecompileAiOption(this.checked)">
                        <div>
                            <div
                                style="display: flex; align-items: center; gap: 0.4rem; font-weight: 700; font-size: 0.9rem; color: var(--text-primary);">
                                <span> Regenerate AI Insights (Live LLM Inference)</span>
                                <span class="badge"
                                    style="background: rgba(59, 130, 246, 0.15); color: #3b82f6; border: 1px solid rgba(59, 130, 246, 0.3); font-size: 0.68rem; padding: 0.15rem 0.4rem;">Recommended</span>
                            </div>
                            <p
                                style="margin: 0.3rem 0 0 0; font-size: 0.78rem; color: var(--text-muted); line-height: 1.45;">
                                Executes performance engineering prompts against your active LLM to generate fresh
                                findings, observations, and recommendations taking defined SLA targets into account.
                            </p>
                        </div>
                    </label>

                    <div id="recompile-ai-meta"
                        style="margin-top: 0.75rem; padding-top: 0.6rem; border-top: 1px solid var(--border-color); font-size: 0.76rem; color: var(--text-muted); display: flex; justify-content: space-between; align-items: center;">
                        <span>Active Provider: <strong id="recompile-active-provider"
                                style="color: var(--text-primary);">Checking...</strong></span>
                        <span>Model: <code id="recompile-active-model" style="font-size: 0.74rem;">--</code></span>
                    </div>
                </div>

                <div id="recompile-status-bar" class="hidden"
                    style="background: var(--bg-subtle); border: 1px solid var(--border-color); padding: 0.65rem 1rem; border-radius: 8px; font-size: 0.82rem; display: flex; align-items: center; gap: 0.6rem; color: var(--primary-color);">
                    <div class="spinner-inline"></div>
                    <span id="recompile-status-text">Recompiling report... please wait.</span>
                </div>
            </div>

            <div class="modal-footer"
                style="padding: 1rem 1.5rem; background: var(--bg-subtle); border-top: 1px solid var(--border-color); border-radius: 0 0 var(--border-radius-md) var(--border-radius-md); display: flex; justify-content: flex-end; gap: 0.75rem;">
                <button type="button" class="btn secondary-btn" onclick="closeRecompileModal()"
                    id="recompile-cancel-btn">Cancel</button>
                <button type="button" class="btn btn-primary" onclick="executeRecompile()" id="recompile-submit-btn"
                    style="font-weight: 700;">
                    ⚡ Start Recompilation
                </button>
            </div>
        </div>
    </div>
