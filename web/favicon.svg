<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="pulse" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Sleek rounded dark squircle card -->
  <rect width="64" height="64" rx="16" fill="url(#bg)" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.4"/>
  <!-- Telemetry baseline -->
  <line x1="8" y1="32" x2="56" y2="32" stroke="#334155" stroke-width="1" stroke-dasharray="2,2"/>
  <!-- Performance Telemetry Pulse Wave -->
  <polyline points="10,32 20,32 26,48 35,16 42,40 48,32 54,32" fill="none" stroke="url(#pulse)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <!-- Peak Performance Metric Dot -->
  <circle cx="35" cy="16" r="3.5" fill="#38bdf8" filter="url(#glow)"/>
</svg>
